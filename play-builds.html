<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kido Builds: Dinosaur Shapes Puzzle Game for Kids 3–6 | KidoDino</title>
<meta name="description" content="A free, wordless shape game for ages 3 to 6: build a house, a rocket and a train from circles, squares and triangles. No ads, no sign-up.">
<meta name="theme-color" content="#6040B0">
<link rel="icon" href="assets/img/favicon-star-32.png" sizes="32x32">
<link rel="icon" href="assets/img/favicon-star-48.png" sizes="48x48">
<link rel="icon" href="assets/img/favicon-star-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon-kido-180.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="play.css">
</head>
<body>
<main class="stage">
  <h1 class="sr">Kido Builds</h1>
  <div class="field build">
    <div class="hills" id="hills"></div>
    <div class="side">
      <button class="kido" id="kido" type="button" aria-label="Kido: show me a hint"><span class="kido-art" data-kido-svg aria-hidden="true"><img src="assets/img/kido-wave-420.png" width="420" height="588" alt=""></span></button>
    </div>
    <div class="page"><svg id="canvas" viewBox="0 0 200 170" role="img" aria-label="The picture you are building"></svg></div>
    <div class="tray" id="tray" role="group" aria-label="Shapes"></div>
  </div>
  <p class="sr" id="live" aria-live="polite"></p>
</main>
<script src="kd-art.js"></script>
<script src="kd-play.js"></script>
<script src="builds.js"></script>
<script src="kido.js"></script>
</body>
</html>
