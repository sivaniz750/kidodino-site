<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kido's Treasure Hunt · KidoDino</title>
<meta name="description" content="A free, wordless thinking game for ages 3 to 6: find everything that matches Kido's rule, then flip the switch to play another way. No ads, no sign-up.">
<meta name="theme-color" content="#6040B0">
<link rel="icon" href="assets/img/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/img/icon-180.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="play.css">
</head>
<body>
<main class="stage">
  <h1 class="sr">Kido's Treasure Hunt</h1>
  <div class="field hunt">
    <div class="hills" id="hills"></div>
    <div class="side"><button class="kido" id="kido" type="button" aria-label="Kido: show me what to find"><span class="kido-art" data-kido-svg aria-hidden="true"><img src="assets/img/kido-wave-420.png" width="420" height="588" alt=""></span></button></div>
    <div class="board" id="board" role="group" aria-label="Pictures"></div>
    <div class="goal">
      <button class="toggle" id="toggle" type="button" role="switch" aria-checked="false" aria-label="Way to play: by color, or by kind of thing"></button>
      <div class="rule" id="rule" aria-hidden="true"></div>
      <div class="basket" id="basket" role="img" aria-label="Basket"></div>
    </div>
  </div>
  <p class="sr" id="live" aria-live="polite"></p>
</main>
<script src="kd-art.js"></script>
<script src="kd-play.js"></script>
<script src="hunt.js"></script>
<script src="kido.js"></script>
</body>
</html>
